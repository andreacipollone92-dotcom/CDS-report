<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Eurora Living</title>
<style>
  :root{
    --blue-deep: #0c2740;
    --blue-panel: #123457;
    --blue-line: #2c5580;
    --paper: #eef3f8;
    --amber: #ff9f1c;
    --amber-dim: #7a5417;
    --green: #4fb477;
    --text-dim: #9fb6cc;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--blue-deep);
    color:var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
  }
  .mono{ font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; letter-spacing:0.02em; }

  header{
    position:sticky; top:0; z-index:10;
    background: rgba(12,39,64,0.92);
    backdrop-filter: blur(6px);
    border-bottom:1px solid var(--blue-line);
    padding:14px 16px 12px;
  }
  header .eyebrow{
    font-size:19px; font-weight:700; text-transform:uppercase; color:var(--amber);
    letter-spacing:0.06em;
  }
  .header-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .total-badge{
    font-size:16px; font-weight:700; color:var(--amber);
    border:1px solid var(--amber-dim);
    border-radius:8px;
    padding:2px 10px;
    flex:0 0 auto;
  }
  header .sub{ color:var(--text-dim); font-size:13px; margin-top:4px; }

  .toolbar{
    display:flex; gap:8px; padding:12px 16px 0;
  }
  .btn{
    border:1px solid var(--blue-line);
    background:var(--blue-panel);
    color:var(--paper);
    padding:9px 14px;
    border-radius:8px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .btn:active{ background:var(--blue-line); }
  .btn.ghost{ background:transparent; }
  .btn.amber{ border-color:var(--amber); color:var(--amber); }

  main{ padding:16px; padding-bottom:60px; max-width:640px; margin:0 auto; }

  /* HOME: griglia interni */
  .grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:10px;
    margin-top:16px;
  }
  .tile{
    background:var(--blue-panel);
    border:1px solid var(--blue-line);
    border-radius:var(--radius);
    padding:14px 8px;
    text-align:center;
    cursor:pointer;
    position:relative;
    overflow:hidden;
  }
  .tile:active{ transform: scale(0.97); }
  .tile .code{ font-size:16px; font-weight:700; }
  .tile .pct{ font-size:11px; color:var(--text-dim); margin-top:4px; }
  .tile .bar{
    position:absolute; left:0; bottom:0; height:3px;
    background:var(--amber);
  }
  .tile.complete .code{ color:var(--green); }
  .tile.complete .bar{ background:var(--green); }

  .section-label{
    font-size:12px; text-transform:uppercase; letter-spacing:0.1em;
    color:var(--text-dim); margin:20px 0 8px;
  }

  /* DETTAGLIO */
  .cat-block{ margin-bottom:18px; }
  .cat-title{
    font-size:13px; font-weight:700; text-transform:uppercase;
    color:var(--amber); letter-spacing:0.08em;
    padding-bottom:6px; margin-bottom:6px;
    border-bottom:1px solid var(--blue-line);
  }
  .voce-row{
    display:flex; align-items:center; gap:10px;
    padding:9px 0;
    border-bottom:1px solid rgba(44,85,128,0.4);
  }
  .voce-label{
    flex:1; font-size:14.5px; line-height:1.3;
  }
  .voce-label.done{ color:var(--text-dim); text-decoration:line-through; text-decoration-color:var(--green); }

  .check{
    flex:0 0 auto;
    width:30px; height:30px;
    border-radius:7px;
    border:2px solid var(--blue-line);
    background:var(--blue-deep);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .check svg{ width:18px; height:18px; opacity:0; transform:scale(0.5); transition: all .12s ease; }
  .check.checked{ background:var(--green); border-color:var(--green); }
  .check.checked svg{ opacity:1; transform:scale(1); }

  .note-input{
    flex:0 0 92px;
    background:var(--blue-deep);
    border:1px solid var(--blue-line);
    border-radius:7px;
    color:var(--paper);
    font-size:12.5px;
    padding:6px 8px;
  }
  .note-input::placeholder{ color:#5c7c9c; }
  .note-input:focus{ outline:2px solid var(--amber); border-color:var(--amber); }

  .back-row{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 12px;margin:0 -12px 14px;
  background:rgba(255,255,255,.98);backdrop-filter:blur(9px);
  border-bottom:1px solid var(--blue-line);box-shadow:0 3px 12px rgba(0,0,0,.08)
}
.detail-heading{min-width:0}
.interno-title{
  color:#0c2740;font-size:24px;line-height:1.05;font-weight:900;
  letter-spacing:.01em
}
.interno-progress{
  color:#718394;font-size:12px;font-weight:650;margin-top:4px
}
.save-home-btn{
  flex:0 0 auto;border:0;border-radius:9px;padding:10px 13px;
  background:#123457;color:#fff;font-weight:850;font-size:11px;
  letter-spacing:.02em;cursor:pointer;white-space:nowrap
}
.save-home-btn:active{transform:scale(.98)}

  #toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--amber); color:#241300; font-weight:700; font-size:13px;
    padding:9px 16px; border-radius:20px; opacity:0; pointer-events:none;
    transition: all .25s ease;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .hidden{ display:none !important; }
  body.detail-mode #app-header{ display:none; }
  body.detail-mode #toolbar{ display:none; }
  body.detail-mode main{ padding-top:0; }

</style>
</head>
<body>

<header id="app-header">
  <div class="header-row">
    <div class="eyebrow mono">CANTIERE EURORA LIVING</div>
    <div class="total-badge mono" id="total-badge">0%</div>
  </div>
  <div class="sub" id="header-sub">Tocca un interno per compilare</div>
</header>

<div class="toolbar" id="toolbar">
  <button class="btn amber" onclick="openReport()">📊 Report</button>
    <button class="btn amber" onclick="downloadShareReport()">📤 Condividi Report</button>
  <button class="btn" onclick="exportJSON()">⬇ Esporta JSON</button>
  <button class="btn" onclick="exportCSV()">⬇ Esporta CSV</button>
  <button class="btn ghost" onclick="triggerImport()">⬆ Carica JSON</button>
  <input type="file" id="import-input" accept="application/json" class="hidden" onchange="importJSON(event)">
</div>

<main>

  <!-- VISTA HOME -->
  <div id="view-home">
    <div id="interni-groups"></div>
  </div>

  <!-- VISTA DETTAGLIO -->
  <div id="view-detail" class="hidden">
    <div class="back-row">
      <div class="detail-heading">
        <div class="interno-title mono" id="detail-title"></div>
        <div class="interno-progress" id="detail-progress"></div>
      </div>
      <button class="save-home-btn" onclick="goHome()">SALVA E TORNA ALLA HOME</button>
    </div>
    <div id="detail-content"></div>
  </div>

</main>

<div id="toast"></div>

<script>
  // ---- DATI DI RIFERIMENTO -------------------------------------------
  // Struttura categorie/voci comune ai piani (dal foglio A1 del file originale).
  // Per estendere a tutti e 98 gli interni, basta ampliare INTERNI ed
  // eventualmente gestire le varianti per-piano (es. piano 0 ha una voce extra).
  const CATEGORIE = [
    { cat: "EDILE", voci: ["CONTROSOFFITTI","PITTURA","PAVIMENTI","RIVESTIMENTI","RIPRESE ZOCCOLINO","FUORI SQUADRO","RITOCCHI PITTURE"] },
    { cat: "INFISSI", voci: ["PORTONCINO","POSA PORTE","MOSTRE PORTE","MOSTRE FINESTRE"] },
    { cat: "IDRAULICO", voci: ["MONTAGGIO SANITARI E LAVABI","TERMOARREDO","MONTAGGIO RUBINETTERIE","COPERCHI CENTRALINE","GRIGLIE RIPRESA E MANDATA","TAVOLETTA","SOFFIONE E BRACCIO","DOCCINO E FLESSIBILE","PLACCA WC","BOX DOCCIA","MOBILETTO LAVABO"] },
    { cat: "ELETTRICO", voci: ["FRUTTI","SPECIALI","INFILAGGIO","LUCE EMERGENZA","PLACCHE","COPERCHI DERIVAZIONE"] },
    { cat: "TERRAZZO", voci: ["PLAFONIERA","SIRENA","PRESE FM","RUBINETTI E PRESA LAVATRICE","TAPPI PILETTE PAVIMENTO","ZOCCOLINO","RASATURA","PITTURA SOFFITTO","PITTURA PARETI"] },
  ];

  // Tutti i 98 interni: edifici A e B, piani 0-6, 7 unità per piano
  // (A01..A07, A11..A17, ... A61..A67, B01..B07, ... B61..B67).
  const INTERNI = [];
  ["A", "B"].forEach(edificio => {
    for (let piano = 0; piano <= 6; piano++) {
      for (let unita = 1; unita <= 7; unita++) {
        INTERNI.push(`${edificio}${piano}${unita}`);
      }
    }
  });

  // Il piano 0 ha una voce in più rispetto agli altri piani.
  const EXTRA_PIANO_ZERO = { cat: "TERRAZZO", voce: "RIVESTIMENTI MURETTI" };

  function pianoDiInterno(interno) {
    return parseInt(interno.substring(1, 2), 10);
  }

  function categorieDiInterno(interno) {
    if (pianoDiInterno(interno) !== 0) return CATEGORIE;
    return CATEGORIE.map(c =>
      c.cat === EXTRA_PIANO_ZERO.cat
        ? { cat: c.cat, voci: [...c.voci, EXTRA_PIANO_ZERO.voce] }
        : c
    );
  }

  function totaleVociDiInterno(interno) {
    return categorieDiInterno(interno).reduce((sum, c) => sum + c.voci.length, 0);
  }

  const STORAGE_KEY = "avanzamento_lavori_v1";

  // ---- STATO / STORAGE --------------------------------------------------
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      console.error("Errore lettura storage", e);
      return {};
    }
  }
  let state = loadState(); // { [interno]: { [voceId]: { done: bool, note: string } } }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function voceId(cat, voce) {
    return (cat + "__" + voce).replace(/\s+/g, "_");
  }

  function getItem(interno, id) {
    return (state[interno] && state[interno][id]) || { done: false, note: "" };
  }

  function setItem(interno, id, patch) {
    if (!state[interno]) state[interno] = {};
    const current = state[interno][id] || { done: false, note: "" };
    state[interno][id] = { ...current, ...patch };
    saveState();
  }

  function countDone(interno) {
    const items = state[interno] || {};
    return Object.values(items).filter(v => v.done).length;
  }

  // ---- RENDER HOME --------------------------------------------------
  function renderHome() {
    const container = document.getElementById("interni-groups");
    container.innerHTML = "";

    const perEdificio = {};
    INTERNI.forEach(interno => {
      const edificio = interno.charAt(0);
      (perEdificio[edificio] = perEdificio[edificio] || []).push(interno);
    });

    Object.keys(perEdificio).sort().forEach(edificio => {
      const label = document.createElement("div");
      label.className = "section-label";
      label.textContent = `Edificio ${edificio}`;
      container.appendChild(label);

      const grid = document.createElement("div");
      grid.className = "grid";
      perEdificio[edificio].forEach(interno => {
        const total = totaleVociDiInterno(interno);
        const done = countDone(interno);
        const pct = Math.round((done / total) * 100);
        const tile = document.createElement("div");
        tile.className = "tile mono" + (pct === 100 ? " complete" : "");
        tile.innerHTML = `
          <div class="code">${interno}</div>
          <div class="pct">${done}/${total}</div>
          <div class="bar" style="width:${pct}%"></div>
        `;
        tile.onclick = () => openInterno(interno);
        grid.appendChild(tile);
      });
      container.appendChild(grid);
    });

    document.getElementById("header-sub").textContent = "Tocca un interno per compilare";
    updateTotalBadge();
  }

  function updateTotalBadge() {
    let totalPossible = 0;
    let totalDone = 0;
    INTERNI.forEach(interno => {
      totalPossible += totaleVociDiInterno(interno);
      totalDone += countDone(interno);
    });
    const pct = totalPossible ? Math.round((totalDone / totalPossible) * 100) : 0;
    document.getElementById("total-badge").textContent = `${pct}%`;
  }

  // ---- RENDER DETTAGLIO --------------------------------------------------
  function openInterno(interno) {
    document.body.classList.add('detail-mode');
    document.getElementById("view-home").classList.add("hidden");
    document.getElementById("view-detail").classList.remove("hidden");
    document.getElementById("toolbar").classList.add("hidden");
    renderDetail(interno);
  }

  function goHome() {
    document.body.classList.remove('detail-mode');
    document.getElementById("view-detail").classList.add("hidden");
    document.getElementById("view-home").classList.remove("hidden");
    document.getElementById("toolbar").classList.remove("hidden");
    renderHome();
  }

  function updateProgressLabel(interno) {
    const done = countDone(interno);
    const total = totaleVociDiInterno(interno);
    document.getElementById("detail-progress").textContent = `${done} di ${total} completate`;
  }

  function renderDetail(interno) {
    document.getElementById("detail-title").textContent = interno;
    updateProgressLabel(interno);

    const container = document.getElementById("detail-content");
    container.innerHTML = "";

    categorieDiInterno(interno).forEach(({ cat, voci }) => {
      const block = document.createElement("div");
      block.className = "cat-block";

      const title = document.createElement("div");
      title.className = "cat-title";
      title.textContent = cat;
      block.appendChild(title);

      voci.forEach(voce => {
        const id = voceId(cat, voce);
        const item = getItem(interno, id);

        const row = document.createElement("div");
        row.className = "voce-row";

        const check = document.createElement("div");
        check.className = "check" + (item.done ? " checked" : "");
        check.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#0c2740" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;

        const label = document.createElement("div");
        label.className = "voce-label" + (item.done ? " done" : "");
        label.textContent = voce;

        const note = document.createElement("input");
        note.type = "text";
        note.className = "note-input";
        note.placeholder = "nota";
        note.value = item.note || "";

        check.onclick = () => {
          const nowDone = !getItem(interno, id).done;
          setItem(interno, id, { done: nowDone });
          check.classList.toggle("checked", nowDone);
          label.classList.toggle("done", nowDone);
          updateProgressLabel(interno);
          updateTotalBadge();
          showToast(nowDone ? "Segnato come fatto" : "Segnato come da fare");
        };

        note.addEventListener("input", () => {
          setItem(interno, id, { note: note.value });
        });

        row.appendChild(check);
        row.appendChild(label);
        row.appendChild(note);
        block.appendChild(row);
      });

      container.appendChild(block);
    });
  }

  // ---- TOAST --------------------------------------------------
  let toastTimer;
  function showToast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1200);
  }

  // ---- EXPORT --------------------------------------------------
  function timestamp() {
    const d = new Date();
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
  }

  function downloadBlob(content, filename, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function exportJSON() {
    downloadBlob(JSON.stringify(state, null, 2), `avanzamento_${timestamp()}.json`, "application/json");
    showToast("JSON esportato");
  }

  function exportCSV() {
    const rows = [["INTERNO", "CATEGORIA", "VOCE", "FATTO", "NOTA"]];
    INTERNI.forEach(interno => {
      categorieDiInterno(interno).forEach(({ cat, voci }) => {
        voci.forEach(voce => {
          const id = voceId(cat, voce);
          const item = getItem(interno, id);
          rows.push([interno, cat, voce, item.done ? "OK" : "", item.note || ""]);
        });
      });
    });
    const csv = rows.map(r =>
      r.map(field => `"${String(field).replace(/"/g, '""')}"`).join(";")
    ).join("\r\n");
    downloadBlob("\uFEFF" + csv, `avanzamento_${timestamp()}.csv`, "text/csv;charset=utf-8");
    showToast("CSV esportato");
  }

  // ---- IMPORT --------------------------------------------------
  function triggerImport() {
    document.getElementById("import-input").click();
  }

  function importJSON(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const incoming = JSON.parse(reader.result);
        const merged = mergeState(state, incoming);
        state = merged;
        saveState();
        renderHome();
        showToast("JSON caricato e unito");
      } catch (e) {
        console.error(e);
        alert("File non valido: impossibile leggere il JSON.");
      }
    };
    reader.readAsText(file);
    event.target.value = ""; // permette di ricaricare lo stesso file più volte
  }

  // Unisce due stati voce per voce. In caso di conflitto (stesso interno
  // e stessa voce compilati diversamente sui due file), vince il valore
  // "più avanzato": fatto batte non fatto, nota non vuota batte nota vuota.
  function mergeState(base, incoming) {
    const result = JSON.parse(JSON.stringify(base));
    Object.keys(incoming || {}).forEach(interno => {
      if (!result[interno]) result[interno] = {};
      Object.keys(incoming[interno]).forEach(id => {
        const a = result[interno][id] || { done: false, note: "" };
        const b = incoming[interno][id] || { done: false, note: "" };
        result[interno][id] = {
          done: a.done || b.done,
          note: (b.note && b.note.trim()) ? b.note : a.note,
        };
      });
    });
    return result;
  }


  // ---- REPORT CAPO ------------------------------------------------------
  function reportEsc(v) {
    return String(v ?? "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function reportStats(interno) {
    const total = totaleVociDiInterno(interno);
    const done = countDone(interno);
    const missing = [], completed = [];
    categorieDiInterno(interno).forEach(({cat, voci}) => {
      voci.forEach(voce => {
        const item = getItem(interno, voceId(cat, voce));
        const row = {cat, voce, note: item.note || ""};
        (item.done ? completed : missing).push(row);
      });
    });
    return {total, done, missing, completed, pct: total ? Math.round(done / total * 100) : 0};
  }

  let lastReportWindow = null;

  function openReport() {
    const w = window.open("", "_blank");
    if (!w) {
      alert("Consenti le finestre popup per aprire il report.");
      return;
    }
    lastReportWindow = w;

    const now = new Date();
    const date = now.toLocaleDateString("it-IT", {day:"2-digit", month:"2-digit", year:"numeric"});
    const time = now.toLocaleTimeString("it-IT", {hour:"2-digit", minute:"2-digit"});

    const stats = {};
    let total = 0, done = 0;
    INTERNI.forEach(i => {
      stats[i] = reportStats(i);
      total += stats[i].total;
      done += stats[i].done;
    });
    const totalPct = total ? Math.round(done / total * 100) : 0;

    function building(edificio) {
      const arr = INTERNI.filter(i => i.startsWith(edificio));
      const t = arr.reduce((s,i) => s + stats[i].total, 0);
      const d = arr.reduce((s,i) => s + stats[i].done, 0);
      return {t, d, pct: t ? Math.round(d / t * 100) : 0};
    }
    const A = building("A"), B = building("B");

    const bar = pct => `<div class="bar"><span style="width:${pct}%"></span></div>`;

    function card(i) {
      const s = stats[i];
      return `<a class="unit ${s.pct===100 ? "complete":""}" href="#detail-${reportEsc(i)}">
        <div class="unit-top"><b>${reportEsc(i)}</b><strong>${s.pct}%</strong></div>
        ${bar(s.pct)}
        <div class="unit-foot"><span>${s.done}/${s.total}</span><span>${s.pct===100 ? "COMPLETO" : `${s.missing.length} da fare`}</span></div>
      </a>`;
    }

    function detail(i) {
      const s = stats[i];
      const byCat = {};
      s.missing.forEach(x => (byCat[x.cat] ||= []).push(x));
      const missing = s.missing.length ? Object.entries(byCat).map(([cat, rows]) => `
        <div class="cat">
          <div class="cat-title">${reportEsc(cat)}</div>
          ${rows.map(x => `<div class="missing"><span>○</span><span>${reportEsc(x.voce)}</span>
            ${x.note.trim() ? `<em>${reportEsc(x.note)}</em>` : ""}</div>`).join("")}
        </div>`).join("") : `<div class="done-box">✓ INTERNO COMPLETATO</div>`;

      return `<section class="detail" id="detail-${reportEsc(i)}">
        <div class="detail-head">
          <div><div class="detail-code">${reportEsc(i)}</div><small>${s.done} di ${s.total} completate</small></div>
          <div class="detail-pct">${s.pct}%</div>
        </div>
        ${bar(s.pct)}
        <div class="missing-title">${s.missing.length ? `COSA MANCA · ${s.missing.length}` : "STATO"}</div>
        ${missing}
        ${s.completed.length ? `<details><summary>✓ Mostra ${s.completed.length} completate</summary>
          <div class="completed">${s.completed.map(x => `<span>✓ ${reportEsc(x.voce)}</span>`).join("")}</div>
        </details>` : ""}
        <a class="back" href="#overview">↑ Torna alla panoramica</a>
      </section>`;
    }

    const unitGroups = ["A","B"].map(edificio => `
      <section class="units-section">

  function downloadShareReport() {
    // Usa la stessa finestra del report e salva l'HTML già costruito.
    const w = openReport();
    if (!w) return;

    setTimeout(() => {
      if (!w || w.closed || !w.document || !w.document.documentElement) {
        alert("Impossibile preparare il report.");
        return;
      }

      const htmlContent = "<!doctype html>" + w.document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], {type: "text/html;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const d = new Date();
      const pad = n => String(n).padStart(2, "0");
      const filename = `report_eurora_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.html`;

      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);

      if (typeof showToast === "function") showToast("Report HTML pronto da condividere");
    }, 500);
  }
